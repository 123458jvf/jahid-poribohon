name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor প্রজেক্ট তৈরি
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "জাহিদ পরিবহন" com.gari.hisab --web-dir www
          npx cap add android
          npx cap sync android

      - name: APK বানানো
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jahid-poribohon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release-এ APK রাখা (ফোন থেকে সরাসরি ডাউনলোড)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jahid-poribohon.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest jahid-poribohon.apk --title "জাহিদ পরিবহন APK" --notes "সর্বশেষ বিল্ড"
