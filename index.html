<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Cookie check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        background: light-dark(#F8F8F7, #191919);
        color: light-dark(#1f1f1f, #e3e3e3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      .container {
        background: light-dark(#FFFFFF, #1F1F1F);
        padding: 32px;
        border-radius: 16px;
        border: 1px solid light-dark(#E2E3E4, #3E3E3E);
        max-width: min(80%, 500px);
        width: 100%;
        color: light-dark(#2B2D31, #D4D4D4);
      }

      /* Loading Spinner Animation */
      .spinner {
        margin: 0 auto 1.5rem auto;
        width: 40px;
        height: 40px;
        border: 4px solid light-dark(#f0f0f0, #262626);
        border-top: 4px solid light-dark(#076eff, #87a9ff); /* Blue color */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .logo {
        border-radius: 10px;
        display: block;
        margin: 0 auto 2rem auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="logo"
        src="https://www.gstatic.com/images/branding/productlogos/ai_studio/v1/web-512dp/logo_ai_studio_color_1x_web_512dp.png"
        alt="AI Studio Logo"
        width="256"
        height="256"
      />
      <div class="spinner"></div>
    </div>
    <script>
      function redirectToReturnUrl() {
        const initialReturnUrlStr = new URLSearchParams(window.location.search).get('return_url');
        if (!initialReturnUrlStr) return;

        try {
          const returnUrl = new URL(initialReturnUrlStr);
          // Prevent potentially malicious URLs from being used
          if (returnUrl.protocol.toLowerCase() === 'javascript:') {
            console.error('Potentially malicious return URL blocked');
            return;
          }
          window.location.href = returnUrl.toString();
        } catch (e) {
          console.error('Invalid return URL', e);
        }
      }

      // Automatically redirect without checking cookies or showing error UI
      redirectToReturnUrl();
    </script>
  </body>
</html>
